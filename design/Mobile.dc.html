<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap">
  <style>
    :root {
      --ink: #050505; --panel: #131313; --panel-2: #1a1a1a;
      --line: rgba(212, 175, 55, 0.14); --line-2: rgba(255, 255, 255, 0.07);
      --gold: #d4af37; --gold-dim: rgba(212, 175, 55, 0.55);
      --gold-a08: rgba(212, 175, 55, 0.08); --gold-a30: rgba(212, 175, 55, 0.3);
      --text: #f4f0ec; --text-2: #a8a6a1; --text-3: #7d7b77;
      --ok: #4e9463; --danger: #c04a4a;
      --r-sharp: 2px; --r-pill: 999px;
      --fd: 'Playfair Display', Georgia, serif;
      --fb: 'Outfit', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 390px; height: 844px; overflow: hidden;
      font-family: var(--fb); font-size: 15px; line-height: 1.5;
      color: var(--text-2);
      background: var(--ink);
      background-image: radial-gradient(110% 60% at 50% 0%, #0d0d0d 0%, #050505 70%);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--gold); text-decoration: none; }
    a:hover { color: #e6c65a; }
    h1, h2, h3, h4, p { margin: 0; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</helmet>

<div style="display: grid; grid-template-rows: auto auto auto 1fr auto; height: 844px;">

  <!-- Le HUD suit le joueur sur téléphone aussi : plus de bannière de solde -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line);">
    <h1 style="font-family: var(--fd); font-size: 1.5rem; color: var(--text); font-weight: 600;">Boutique</h1>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 9px; padding: 6px 11px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--panel);">
      <span style="font-size: 0.72rem; color: var(--text-3); letter-spacing: 0.5px;">Niv.&nbsp;6</span>
      <span style="width: 1px; height: 15px; background: var(--line-2);"></span>
      <span style="font-family: var(--fd); font-size: 1.05rem; color: var(--gold); font-variant-numeric: tabular-nums;">1&nbsp;240</span>
      <span style="font-size: 0.72rem; color: var(--gold); opacity: 0.7;">z&#322;</span>
    </div>
    <button style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: var(--text-2);">
      <span style="width: 30px; height: 30px; border-radius: var(--r-pill); background: linear-gradient(140deg, #3a3a3a, #1a1a1a); border: 1px solid var(--gold-a30);"></span>
      <span style="position: absolute; top: 4px; right: 2px; min-width: 15px; height: 15px; padding: 0 4px; display: grid; place-items: center; border-radius: var(--r-pill); background: var(--gold); color: #0a0a0a; font-size: 0.59rem; font-weight: 600; border: 2px solid #080808;">2</span>
    </button>
  </div>

  <!-- Qui est là, en bande compacte : le rail du bureau n'existe pas ici,
       mais la tablée doit rester lisible sans ouvrir un écran de plus. -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 9px 14px 0;">
    <div style="display: flex; align-items: center;">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
        <span style="position: relative; display: block; margin-left: {{p.overlap}};">
          <span style="display: grid; place-items: center; width: 26px; height: 26px; border-radius: var(--r-pill); background: linear-gradient(140deg, #3a3a3a, #1a1a1a); border: 2px solid #0b0b0b; font-size: 0.66rem; color: {{p.ink}}; opacity: {{p.opacity}}; filter: {{p.filter}};">{{p.initial}}</span>
          <span style="position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: var(--r-pill); border: 2px solid #0b0b0b; background: {{p.dot}}; box-shadow: {{p.glow}};"></span>
        </span>
      </sc-for>
    </div>
    <span style="font-size: 0.76rem; color: var(--text-3);">5 autour de la table</span>
  </div>

  <!-- Un seul rang de filtres, il défile horizontalement -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 11px 14px; overflow: hidden;">
    <span style="flex-shrink: 0; display: grid; place-items: center; min-height: 34px; padding: 0 14px; border-radius: var(--r-pill); font-size: 0.82rem; color: var(--gold); background: var(--gold-a08); border: 1px solid var(--gold);">Tout</span>
    <span style="flex-shrink: 0; display: grid; place-items: center; min-height: 34px; padding: 0 14px; border-radius: var(--r-pill); font-size: 0.82rem; color: var(--text-2); border: 1px solid var(--line-2);">Privil&egrave;ges</span>
    <span style="flex-shrink: 0; display: grid; place-items: center; min-height: 34px; padding: 0 14px; border-radius: var(--r-pill); font-size: 0.82rem; color: var(--text-2); border: 1px solid var(--line-2);">Bonus</span>
    <span style="flex-shrink: 0; display: grid; place-items: center; min-height: 34px; padding: 0 14px; border-radius: var(--r-pill); font-size: 0.82rem; color: var(--text-2); border: 1px solid var(--line-2);">Handi&hellip;</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 13px; padding: 3px 14px 0; overflow: hidden;">

    <!-- Le booster, en bandeau court -->
    <div style="display: flex; align-items: center; gap: 13px; padding: 13px; border: 1px solid rgba(255,138,61,0.45); border-radius: var(--r-sharp); background: linear-gradient(120deg, rgba(255,138,61,0.13) 0%, rgba(10,10,10,0.6) 60%);">
      <div style="width: 52px; height: 66px; flex-shrink: 0; border-radius: 4px; border: 1px solid rgba(255,138,61,0.5); background: linear-gradient(160deg, #2a1608, #120a04); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="22" height="22" style="color: #ff8a3d;"><path d="M12 3.5 3.5 7v10L12 20.5 20.5 17V7L12 3.5Z"></path><path d="M3.5 7 12 10.5 20.5 7M12 10.5v10"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1;">
        <span style="font-size: 0.6rem; letter-spacing: 1.8px; text-transform: uppercase; color: #ff8a3d;">Le booster</span>
        <h3 style="font-family: var(--fd); font-size: 1.12rem; color: var(--text); font-weight: 600; line-height: 1.15;">Premi&egrave;re Nuit</h3>
        <span style="font-size: 0.75rem; color: var(--text-3);">2 paquets en r&eacute;serve</span>
      </div>
      <button style="flex-shrink: 0; min-height: 44px; padding: 0 15px; border: 1px solid rgba(255,138,61,0.5); border-radius: var(--r-sharp); background: rgba(255,138,61,0.14); color: #ff8a3d; font-family: var(--fb); font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">Ouvrir</button>
    </div>

    <!-- Deux colonnes : on voit six articles sans bouger le pouce -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; align-content: start; overflow: hidden;">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 7px; padding: 13px; min-height: 44px; border: 1px solid {{item.soft}}; border-radius: var(--r-sharp); background: linear-gradient(150deg, {{item.wash}} 0%, rgba(0,0,0,0.55) 62%);">
          <div style="display: flex; align-items: center; gap: 7px;">
            <span style="width: 5px; height: 5px; transform: rotate(45deg); background: {{item.si}}; flex-shrink: 0;"></span>
            <span style="font-size: 0.56rem; letter-spacing: 1.6px; text-transform: uppercase; color: {{item.si}};">{{item.fam}}</span>
          </div>
          <h4 style="font-family: var(--fd); font-size: 1.02rem; line-height: 1.15; color: var(--text); font-weight: 600; text-wrap: pretty;">{{item.name}}</h4>
          <p style="font-size: 0.74rem; line-height: 1.4; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{item.desc}}</p>
          <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 2px;">
            <span style="font-family: var(--fd); font-size: 1.1rem; color: var(--gold); font-variant-numeric: tabular-nums;">{{item.price}}</span>
            <span style="font-size: 0.68rem; color: var(--gold); opacity: 0.7;">z&#322;</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- La barre d'onglets du téléphone, alignée sur les six destinations du bureau -->
  <div style="display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line); background: rgba(8,8,8,0.97);">

    <div style="position: relative; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3);">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="5" width="18" height="16" rx="1"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span style="font-size: 0.64rem;">&Eacute;v&eacute;nem.</span>
    </div>

    <div style="position: relative; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3);">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="2.5" y="8" width="19" height="10" rx="4"></rect><path d="M7 11v4M5 13h4M15.6 12.6h.01M18 15.2h.01"></path></svg>
      <span style="font-size: 0.64rem;">Jeux</span>
    </div>

    <div style="position: relative; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--gold);">
      <span style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 26px; height: 2px; background: var(--gold);"></span>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 8h16l-1.2 12H5.2L4 8Z"></path><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"></path></svg>
      <span style="font-size: 0.64rem;">Boutique</span>
    </div>

    <div style="position: relative; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3);">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3s5 4.6 5 9.2a5 5 0 0 1-10 0c0-1.9 1-3.4 1-3.4s.6 1.7 1.6 2.4c-.2-3.2 2.4-8.2 2.4-8.2Z"></path></svg>
      <span style="font-size: 0.64rem;">D&eacute;fis</span>
      <span style="position: absolute; top: 8px; right: 13px; min-width: 15px; height: 15px; padding: 0 4px; display: grid; place-items: center; border-radius: var(--r-pill); background: var(--gold); color: #0a0a0a; font-size: 0.59rem; font-weight: 600; border: 2px solid #080808;">3</span>
    </div>

    <div style="position: relative; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3);">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="8.5" y="3.5" width="11" height="15" rx="1.5"></rect><path d="M5.5 7v11.5A2.5 2.5 0 0 0 8 21h8"></path></svg>
      <span style="font-size: 0.64rem;">Collect.</span>
      <span style="position: absolute; top: 8px; right: 11px; min-width: 15px; height: 15px; padding: 0 4px; display: grid; place-items: center; border-radius: var(--r-pill); background: var(--gold); color: #0a0a0a; font-size: 0.59rem; font-weight: 600; border: 2px solid #080808;">2</span>
    </div>

    <!-- Les Fins Gourmets et le panneau admin vivent ici : sur six onglets,
         c'est la place qui reste, et ce sont les deux qu'on ouvre le moins. -->
    <div style="position: relative; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3);">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>
      <span style="font-size: 0.64rem;">Plus</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const FAM = {
      privilege: { tag: "Privilège", si: "#d4af37", soft: "rgba(212,175,55,0.42)", wash: "rgba(212,175,55,0.09)" },
      boost:     { tag: "Bonus",      si: "#4e9463", soft: "rgba(78,148,99,0.5)",   wash: "rgba(78,148,99,0.1)" },
      handicap:  { tag: "Handicap",   si: "#d96a6a", soft: "rgba(192,74,74,0.45)",  wash: "rgba(192,74,74,0.09)" }
    };

    const LIST = [
      ["Choisir le prochain jeu", 120, "privilege", "Tu poses le jeu suivant sur la table. Personne ne discute."],
      ["Bouclier", 200, "boost", "Annule le prochain handicap joué sur toi."],
      ["Une seule main", 180, "handicap", "La victime joue une manche entière à une main."],
      ["Droit de veto", 100, "privilege", "Un jeu de ton choix est interdit pendant une heure."],
      ["Miroir", 280, "boost", "Le prochain handicap repart chez celui qui l'a acheté."],
      ["Écran à l'envers", 220, "handicap", "Une manche, l'écran retourné. Bon courage."],
      ["Maître de la musique", 60, "privilege", "Trente minutes de règne sur l'enceinte."],
      ["Joker", 150, "boost", "Refuse un défi imposé, une fois, sans te justifier."]
    ];

    /* Mêmes valeurs de présence que .presence-dot dans style.css :
       #57b368 et son halo pour qui est là, #6e6e6e pour qui a filé. */
    const players = [["K", true], ["S", true], ["T", true], ["L", true], ["M", false]]
      .map((p, i) => ({
        initial: p[0],
        overlap: i === 0 ? "0" : "-8px",
        ink: p[1] ? "#f4f0ec" : "#7d7b77",
        opacity: p[1] ? "1" : "0.5",
        filter: p[1] ? "none" : "grayscale(100%)",
        dot: p[1] ? "#57b368" : "#6e6e6e",
        glow: p[1] ? "0 0 7px rgba(87,179,104,0.65)" : "none"
      }));

    return {
      players: players,
      items: LIST.map((c) => {
        const f = FAM[c[2]];
        return { name: c[0], price: c[1], desc: c[3], fam: f.tag, si: f.si, soft: f.soft, wash: f.wash };
      })
    };
  }
}
</script>
</body>
</html>
